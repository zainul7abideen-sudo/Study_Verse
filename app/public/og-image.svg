<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="220" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="260" fill="#a855f7" opacity="0.18" filter="url(#glow)" />

  <!-- App Logo Badge -->
  <g transform="translate(100, 110)">
    <rect width="80" height="80" rx="20" fill="#2563eb" />
    <path d="M22 62v-44a6 6 0 0 1 6-6h30v56H28a6 6 0 0 1-6-6Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 28h24M28 38h24" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <text x="100" y="52" fill="#ffffff" font-family="Inter, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">StudyVerse</text>
    <text x="350" y="52" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="700" font-size="20" letter-spacing="2">STUDENT SHOP OS</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="280" fill="#ffffff" font-family="Inter, sans-serif" font-weight="900" font-size="52" letter-spacing="-1.5">
    Campus Book Resale, Lowest Price Search
  </text>
  <text x="100" y="345" fill="url(#primary)" font-family="Inter, sans-serif" font-weight="900" font-size="52" letter-spacing="-1.5">
    &amp; Indian Universities CGPA Engine
  </text>

  <!-- Subtitle -->
  <text x="100" y="420" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="500" font-size="22">
    Compare Amazon &amp; Flipkart prices • Resell pre-loved textbooks • AKTU &amp; VTU CBCS GPA Calculators
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="50" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="32" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="700" font-size="16">⚡ Lowest Price Search</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="200" height="50" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="265" y="32" fill="#34d399" font-family="Inter, sans-serif" font-weight="700" font-size="16">🔄 P2P Book Swap</text>

    <!-- Pill 3 -->
    <rect x="460" y="0" width="210" height="50" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="485" y="32" fill="#c084fc" font-family="Inter, sans-serif" font-weight="700" font-size="16">🎓 AKTU / VTU CGPA</text>

    <!-- Pill 4 -->
    <rect x="690" y="0" width="230" height="50" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="715" y="32" fill="#fbbf24" font-family="Inter, sans-serif" font-weight="700" font-size="16">🤖 Gemini AI Copilot</text>
  </g>
</svg>
